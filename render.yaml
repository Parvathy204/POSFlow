# Render blueprint: single web service that builds the frontend, serves it
# from Express, and uses MongoDB Atlas for storage.
#
# Deploy: push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" and pick the repo. Set the MONGO_URI and JWT_SECRET
# environment variables (or let Render create the managed MongoDB).
services:
  - type: web
    name: posflow
    runtime: node
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    buildCommand: npm --prefix backend ci --omit=dev && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: npm --prefix backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      # Seed the demo accounts/products the first time the database is empty
      # so the portals are testable right after the deploy.
      - key: SEED_DEMO_DATA
        value: "true"
